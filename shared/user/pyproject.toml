[project]
name = "tripgenie-shared-user"
version = "0.1.0"
description = "Shared user microservice for TripGenie."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The aggregate dev/test install. Each service's own pyproject.toml is the slim
# one its image builds from; this one exists so `pytest shared/user/tests` can
# import all three packages without a PYTHONPATH.
#
# The package names are unprefixed, matching student 1 and student 2. That
# means they collide at the top-level import name with those students'
# packages -- install one service per virtualenv, which is what CI does.
where = ["database", "backend", "frontend"]
include = ["database_service*", "backend_service*", "frontend_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    'ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\.',
]
