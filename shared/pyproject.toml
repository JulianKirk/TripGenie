[project]
name = "tripgenie-shared"
version = "0.1.0"
description = "Shared reference microservice for TripGenie."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The aggregate dev/test install. Each service's own pyproject.toml is the slim
# one its image builds from; this one exists so `pytest shared/tests` can
# import both packages without a PYTHONPATH.
#
# The packages are `shared_database_service` / `shared_backend_service` rather
# than student 2's `database_service` / `backend_service` because student 2's
# end-to-end tests install both projects into one environment -- two packages
# of the same name cannot coexist there.
where = ["database", "backend"]
include = ["shared_database_service*", "shared_backend_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    'ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\.',
]
