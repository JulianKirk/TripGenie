[project]
name = "tripgenie-student2-accommodation"
version = "0.1.0"
description = "Student 2 accommodation microservice for TripGenie."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic>=2.8,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The aggregate dev/test install. Each service's own pyproject.toml is the slim
# one its image builds from; this one exists so `pytest student-2/tests` can
# import both packages without a PYTHONPATH.
where = ["database", "backend", "frontend"]
include = ["database_service*", "backend_service*", "frontend_service*"]

[tool.setuptools.package-data]
# Mirrors each service's own pyproject.toml, so an editable install of this
# aggregate finds the prompt asset and the templates too.
backend_service = ["prompts/*.md"]
frontend_service = [
    "templates/*.html",
    "templates/partials/*.html",
    "static/css/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    'ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\.',
]
