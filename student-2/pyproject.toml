[project]
name = "tripgenie-student2-accommodation"
version = "0.1.0"
description = "Student 2 accommodation microservice for TripGenie."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# ponytail: declares dependencies only. `database` is imported via the
# pythonpath in the repo-root pytest.ini, so there is nothing to package --
# this stops setuptools auto-discovering backend/frontend/tests as modules.
py-modules = []
