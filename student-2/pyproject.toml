[project]
name = "tripgenie-student2-accommodation"
version = "0.1.0"
description = "Student 2 accommodation microservice for TripGenie."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The aggregate dev/test install. database/pyproject.toml is the slim one the
# image builds from; this one exists so `pytest student-2/tests` can import
# `database_service` without a PYTHONPATH.
where = ["database"]
include = ["database_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    'ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\.',
]
