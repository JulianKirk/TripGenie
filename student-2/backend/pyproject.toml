[project]
name = "tripgenie-student2-backend"
version = "0.1.0"
description = "Student 2 accommodation backend API microservice for TripGenie."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend_service*"]

[tool.setuptools.package-data]
# pip install is what copies the prompt asset into the image -- without the
# glob the container starts and then 502s on the first ask-box question.
backend_service = ["prompts/*.md"]
