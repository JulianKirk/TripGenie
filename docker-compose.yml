services:
  # Shared Frontend Portal
  shared-ui:
    build:
      context: ./shared/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  # Student 1: Trip & Itinerary Management
  student-1-service:
    build:
      context: ./student-1
      dockerfile: Dockerfile
    ports:
      - "8081:8081"

  # Student 2: Accommodation Management
  # The public face of the accommodation service, and the only caller of the
  # database service behind it.
  student-2-backend:
    build:
      context: ./student-2
      dockerfile: backend/Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      - student-2-database

  # Internal only -- no published port. The backend service is the sole caller
  # and reaches it as http://student-2-database:9001 on the compose network.
  student-2-database:
    build:
      context: ./student-2
      dockerfile: database/Dockerfile
    expose:
      - "9001"
    volumes:
      - student-2-db:/data

  # Student 3: Transport Management
  student-3-service:
    build:
      context: ./student-3
      dockerfile: Dockerfile
    ports:
      - "8083:8083"

  # Student 4: Activities & Attractions Management
  student-4-service:
    build:
      context: ./student-4
      dockerfile: Dockerfile
    ports:
      - "8084:8084"

  # Student 5: Budget & Expense Management
  student-5-service:
    build:
      context: ./student-5
      dockerfile: Dockerfile
    ports:
      - "8085:8085"

  # Local AI Model Runtime (Ollama)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"

volumes:
  student-2-db:
