services:
  # Shared Frontend Portal
  shared-ui:
    build:
      context: ./shared/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  # Shared User Accounts
  # Not one student's feature -- accounts are cross-cutting, so the service
  # lives under shared/ rather than a student-N folder. Same three-service
  # shape as student-2 below, and the same grouping-entry trick: bring the
  # whole thing up with `docker compose up --build shared-user`.
  shared-user:
    image: alpine:3
    command: ["true"]
    depends_on:
      - shared-user-frontend

  # The public face of the user service, and the only caller of the database
  # service behind it. The other students' backends can call it too.
  shared-user-backend:
    build:
      context: ./shared/user
      dockerfile: backend/Dockerfile
    ports:
      - "9100:9100"
    depends_on:
      - shared-user-database

  # The sign-in and account pages. Talks to the backend service and nothing
  # else.
  shared-user-frontend:
    build:
      context: ./shared/user
      dockerfile: frontend/Dockerfile
    ports:
      - "9103:9103"
    depends_on:
      - shared-user-backend

  # Internal only -- no published port. The backend service is the sole caller
  # and reaches it as http://shared-user-database:9101 on the compose network.
  shared-user-database:
    build:
      context: ./shared/user
      dockerfile: database/Dockerfile
    expose:
      - "9101"
    volumes:
      - shared-user-db:/data

  # Student 1: Trip & Itinerary Management
  # Same shape as student-2 below: a grouping container, a public backend, a
  # webpage, and an internal-only database service.
  student-1:
    image: alpine:3
    command: ["true"]
    depends_on:
      - student-1-frontend

  # The public face of the trip service. Student 2's backend calls it to pin
  # accommodations to trips.
  student-1-backend:
    build:
      context: ./student-1
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - student-1-database

  # The trip and itinerary webpage.
  student-1-frontend:
    build:
      context: ./student-1
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - student-1-backend

  # Internal only -- the backend service is the sole caller and reaches it as
  # http://student-1-database:8002 on the compose network.
  student-1-database:
    build:
      context: ./student-1
      dockerfile: database/Dockerfile
    expose:
      - "8002"
    volumes:
      - student-1-db:/data

  # Student 2: Accommodation Management
  # Not a service -- the name you type to bring the whole accommodation
  # micro-service up: `docker compose up --build student-2`. It exits at once;
  # the three services it depends on are the point.
  # ponytail: compose has no way to name a group of services. A container that
  # runs `true` is the cheapest one. Switch to profiles if this ever needs to
  # be excluded from a bare `docker compose up`.
  student-2:
    image: alpine:3
    command: ["true"]
    depends_on:
      - student-2-frontend

  # The public face of the accommodation service, and the only caller of the
  # database service behind it.
  student-2-backend:
    build:
      context: ./student-2
      dockerfile: backend/Dockerfile
    ports:
      - "9000:9000"
    environment:
      # The one cross-student dependency: adding an accommodation to an
      # itinerary is a call to student 1's public API from here, never from
      # the frontend.
      ITINERARY_URL: http://student-1-backend:8001
    depends_on:
      - student-2-database
      - student-1-backend

  # The accommodation webpage. Talks to the backend service and nothing else.
  student-2-frontend:
    build:
      context: ./student-2
      dockerfile: frontend/Dockerfile
    ports:
      - "9003:9003"
    depends_on:
      - student-2-backend

  # Internal only -- no published port. The backend service is the sole caller
  # and reaches it as http://student-2-database:9001 on the compose network.
  student-2-database:
    build:
      context: ./student-2
      dockerfile: database/Dockerfile
    expose:
      - "9001"
    volumes:
      - student-2-db:/data

  # Student 3: Transport Management
  student-3-service:
    build:
      context: ./student-3
      dockerfile: Dockerfile
    ports:
      - "8093:8093"

  # Student 4: Activities & Attractions Management
  student-4-service:
    build:
      context: ./student-4
      dockerfile: Dockerfile
    ports:
      - "8084:8084"

  # Student 5: Budget & Expense Management
  student-5-service:
    build:
      context: ./student-5
      dockerfile: Dockerfile
    ports:
      - "8085:8085"

  # Local AI Model Runtime (Ollama)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"

volumes:
  shared-user-db:
  student-1-db:
  student-2-db:
