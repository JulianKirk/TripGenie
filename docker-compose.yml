# Release 1: AI-Mode (8006), RAG (8011), MCP (8012), Ollama and the agentic
# loop run on the host, never in here. Backends that use them reach the host as
# host.docker.internal; each declares the host-gateway mapping so that name also
# resolves on native Linux Docker Engine, which lacks Docker Desktop's alias. None of
# them is a depends_on or healthcheck target: a stopped host service turns off
# the AI feature, not the container. Startup order and binding notes:
# docs/reports/release-1/local-host-services-runbook.md.
services:
  # Shared Frontend Portal
  shared-ui:
    build:
      context: ./shared/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  # Shared Reference Service
  # Country and city -- the reference data every micro-service needs. Same
  # shape as a student's service: a public backend and an internal-only
  # database service behind it. There is no frontend; the shared portal above
  # is a different thing entirely.
  #
  # ponytail: no grouping container like student-2's. `docker compose up
  # --build shared-backend` starts both, because the backend depends on the
  # database. Add one if a third shared service ever appears.
  shared-backend:
    build:
      context: ./shared
      dockerfile: backend/Dockerfile
    ports:
      - "9100:9100"
    depends_on:
      - shared-database

  # Internal only -- the shared backend is the sole caller and reaches it as
  # http://shared-database:9101 on the compose network.
  shared-database:
    build:
      context: ./shared
      dockerfile: database/Dockerfile
    expose:
      - "9101"
    volumes:
      - shared-db:/data

  # Student 1: Trip & Itinerary Management
  # Same shape as student-2 below: a grouping container, a public backend, a
  # webpage, and an internal-only database service.
  student-1:
    image: alpine:3
    command: ["true"]
    depends_on:
      - student-1-frontend

  # The public face of the trip service. Student 2's backend calls it to pin
  # accommodations to trips, and this one calls student 2 back for the names
  # and nightly rates the trip page shows -- the two services reference each
  # other's data.
  #
  # ponytail: deliberately NO depends_on for student-2-backend. That service
  # already depends on this one, so declaring the reverse is a cycle compose
  # refuses to start. The dependency is a runtime lookup, not a boot order:
  # AccommodationClient returns None when student 2 is not up yet and the trip
  # page renders the stay without a name.
  student-1-backend:
    ports:
      - "127.0.0.1:18001:8001"
    build:
      context: ./student-1
      dockerfile: backend/Dockerfile
    environment:
      STUDENT1_BACKEND_DB_API_BASE_URL: http://student-1-database:8002
      STUDENT1_BACKEND_ACCOMMODATION_API_BASE_URL: http://student-2-backend:9000
      STUDENT1_BACKEND_AI_MODE_BASE_URL: http://host.docker.internal:8006
      STUDENT1_BACKEND_ACTIVITY_API_BASE_URL: http://student-4-backend:8008
      STUDENT1_BACKEND_TRANSPORT_API_BASE_URL: http://student-3-backend:8003
      STUDENT1_BACKEND_RAG_ENABLED: "${STUDENT1_BACKEND_RAG_ENABLED:-true}"
      STUDENT1_BACKEND_RAG_BASE_URL: http://host.docker.internal:8011
      STUDENT1_BACKEND_RAG_TIMEOUT_SECONDS: "130"
      STUDENT1_BACKEND_MCP_ENABLED: "${STUDENT1_BACKEND_MCP_ENABLED:-true}"
      STUDENT1_BACKEND_MCP_BASE_URL: http://host.docker.internal:8012/mcp
      STUDENT1_BACKEND_MCP_TIMEOUT_SECONDS: "40"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8001"
    depends_on:
      student-1-database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The trip and itinerary webpage.
  student-1-frontend:
    build:
      context: ./student-1
      dockerfile: frontend/Dockerfile
    environment:
      STUDENT1_FRONTEND_BACKEND_BASE_URL: http://student-1-backend:8001
      # A browser address, not a compose one: the trip page links out to
      # student 2's webpage, and that link is followed on the user's machine.
      STUDENT1_FRONTEND_ACCOMMODATION_UI_URL: http://localhost:9003
    ports:
      - "8081:8081"
    depends_on:
      student-1-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Internal only -- the backend service is the sole caller and reaches it as
  # http://student-1-database:8002 on the compose network.
  student-1-database:
    build:
      context: ./student-1
      dockerfile: database/Dockerfile
    expose:
      - "8002"
    volumes:
      - student-1-db:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/internal/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Student 2: Accommodation Management
  # Not a service -- the name you type to bring the whole accommodation
  # micro-service up: `docker compose up --build student-2`. It exits at once;
  # the three services it depends on are the point.
  # ponytail: compose has no way to name a group of services. A container that
  # runs `true` is the cheapest one. Switch to profiles if this ever needs to
  # be excluded from a bare `docker compose up`.
  student-2:
    image: alpine:3
    command: ["true"]
    depends_on:
      - student-2-frontend

  # The public face of the accommodation service, and the only caller of the
  # database service behind it.
  student-2-backend:
    build:
      context: ./student-2
      dockerfile: backend/Dockerfile
    ports:
      - "9000:9000"
    environment:
      # The one cross-student dependency: adding an accommodation to an
      # itinerary is a call to student 1's public API from here, never from
      # the frontend.
      ITINERARY_URL: http://student-1-backend:8001
      # Country and city live in the shared reference service. This service
      # stores their ids and publishes their names, so every accommodation
      # response passes through here.
      LOCATION_URL: http://shared-backend:9100
      # The ask box on the accommodation page. Unset it and the service still
      # runs -- /health says "not_configured" and only /accommodation/ai-search
      # is gone.
      AI_MODE_URL: http://host.docker.internal:8006
      # Longer than AI-Mode's own 90-second wait on Ollama (AI_MODE_TIMEOUT_SECONDS
      # in the runbook's host AI-Mode command), so a slow generation is
      # reported by the service that is actually waiting on it rather than
      # guessed at from here. Under it, a 44-second answer -- measured, on a
      # cold model -- reached the page as "ai mode service unavailable" while
      # AI-Mode was still patiently waiting.
      AI_MODE_TIMEOUT: "100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-2-database
      - student-1-backend
      - shared-backend

  # The accommodation webpage. Talks to the backend service and nothing else.
  student-2-frontend:
    build:
      context: ./student-2
      dockerfile: frontend/Dockerfile
    ports:
      - "9003:9003"
    environment:
      # The page's wait on the ask box, and the last one in the chain: the
      # backend's own worst case is AI_MODE_TIMEOUT above times AI_MAX_ATTEMPTS,
      # so this sits above that. Every other call the page makes keeps the
      # ordinary 5 seconds.
      AI_TIMEOUT: "210"
    depends_on:
      - student-2-backend

  # Internal only -- no published port. The backend service is the sole caller
  # and reaches it as http://student-2-database:9001 on the compose network.
  student-2-database:
    build:
      context: ./student-2
      dockerfile: database/Dockerfile
    expose:
      - "9001"
    volumes:
      - student-2-db:/data

  # Student 3: Transport Management
  # Not a service -- the name you type to bring the whole transport slice up:
  # `docker compose up --build student-3`. It exits immediately; the three
  # services it depends on are the point.
  student-3:
    image: alpine:3
    command: ["true"]
    depends_on:
      student-3-frontend:
        condition: service_healthy

  # The transport webpage. Talks to the Student 3 backend and nothing else.
  student-3-frontend:
    build:
      context: ./student-3
      dockerfile: frontend/Dockerfile
    environment:
      STUDENT3_FRONTEND_BACKEND_BASE_URL: "${STUDENT3_FRONTEND_BACKEND_BASE_URL:-http://student-3-backend:8003}"
      STUDENT3_FRONTEND_BACKEND_API_PREFIX: "${STUDENT3_FRONTEND_BACKEND_API_PREFIX:-/api}"
      STUDENT3_FRONTEND_BACKEND_TIMEOUT_SECONDS: "${STUDENT3_FRONTEND_BACKEND_TIMEOUT_SECONDS:-5}"
      # The AI suggestion route only; every other backend call keeps the
      # short timeout above.
      STUDENT3_FRONTEND_AI_TIMEOUT_SECONDS: "${STUDENT3_FRONTEND_AI_TIMEOUT_SECONDS:-150}"
      STUDENT3_FRONTEND_SERVICE_NAME: "${STUDENT3_FRONTEND_SERVICE_NAME:-student-3-frontend}"
    ports:
      - "${STUDENT3_FRONTEND_HOST_PORT:-8093}:8093"
    depends_on:
      student-3-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The public /api surface. The only caller of the database service behind it,
  # and the only thing that reads Student 1's trips API for the trip picker.
  student-3-backend:
    build:
      context: ./student-3
      dockerfile: backend/Dockerfile
    environment:
      STUDENT3_BACKEND_API_PREFIX: "${STUDENT3_BACKEND_API_PREFIX:-/api}"
      STUDENT3_BACKEND_DB_API_BASE_URL: "${STUDENT3_BACKEND_DB_API_BASE_URL:-http://student-3-database:8004}"
      STUDENT3_BACKEND_DB_API_PREFIX: "${STUDENT3_BACKEND_DB_API_PREFIX:-/internal}"
      STUDENT3_BACKEND_DB_API_TIMEOUT_SECONDS: "${STUDENT3_BACKEND_DB_API_TIMEOUT_SECONDS:-5}"
      STUDENT3_BACKEND_TRIPS_API_BASE_URL: "${STUDENT3_BACKEND_TRIPS_API_BASE_URL:-http://student-1-backend:8001}"
      STUDENT3_BACKEND_TRIPS_API_PREFIX: "${STUDENT3_BACKEND_TRIPS_API_PREFIX:-/api}"
      STUDENT3_BACKEND_TRIPS_API_TIMEOUT_SECONDS: "${STUDENT3_BACKEND_TRIPS_API_TIMEOUT_SECONDS:-5}"
      STUDENT3_BACKEND_VERIFY_TRIP_EXISTS: "${STUDENT3_BACKEND_VERIFY_TRIP_EXISTS:-false}"
      STUDENT3_BACKEND_SERVICE_NAME: "${STUDENT3_BACKEND_SERVICE_NAME:-student-3-backend}"
      STUDENT3_BACKEND_CURRENCY: "${STUDENT3_BACKEND_CURRENCY:-AUD}"
      STUDENT3_BACKEND_AI_MODE_BASE_URL: "${STUDENT3_BACKEND_AI_MODE_BASE_URL:-http://host.docker.internal:8006}"
      # Deliberately longer than AI-Mode's own budget so a slow generation
      # comes back as its error rather than as a timeout here.
      STUDENT3_BACKEND_AI_MODE_TIMEOUT_SECONDS: "${STUDENT3_BACKEND_AI_MODE_TIMEOUT_SECONDS:-120}"
      STUDENT3_BACKEND_AI_PROMPT_ASSET: "${STUDENT3_BACKEND_AI_PROMPT_ASSET:-transport_recommendations_v1.md}"
      STUDENT3_BACKEND_AI_PROMPT_MAX_CHARS: "${STUDENT3_BACKEND_AI_PROMPT_MAX_CHARS:-12000}"
      STUDENT3_BACKEND_AI_MAX_CANDIDATES: "${STUDENT3_BACKEND_AI_MAX_CANDIDATES:-12}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8003"
    # Host loopback only, for the host-run MCP server's transport tools.
    ports:
      - "127.0.0.1:18003:8003"
    depends_on:
      student-3-database:
        condition: service_healthy
      # The itinerary service holds which transport belongs to which trip, so
      # every selection and every seat count goes through it. Declared for the
      # same reason student-2-backend declares it: this service reads Student
      # 1's API, and bringing it up alone would leave those routes answering
      # 503. Started rather than healthy, so browsing and comparing still work
      # when Student 1 is unwell.
      student-1-backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Internal only -- no published port. Owns the Student 3 SQLite file; the
  # backend reaches it as http://student-3-database:8004 on the compose network.
  student-3-database:
    build:
      context: ./student-3
      dockerfile: database/Dockerfile
    environment:
      STUDENT3_SQLITE_PATH: "${STUDENT3_SQLITE_PATH:-/data/student-3/tripgenie.db}"
      STUDENT3_SEED_DATA: "${STUDENT3_SEED_DATA:-true}"
    expose:
      - "8004"
    volumes:
      - student-3-sqlite:/data/student-3
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/internal/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Student 4: Activities & Attractions Management
  # Grouping target for the complete Student 4 slice:
  # `docker compose up --build --remove-orphans student-4`. The orphan cleanup
  # retires the old source-serving `student-4-service` container on upgrade.
  student-4:
    image: alpine:3
    command: ["true"]
    depends_on:
      student-4-frontend:
        condition: service_healthy

  # Public activity API. It is the only caller of the Student 4 database
  # service and proxies itinerary choices to Student 1.
  student-4-backend:
    ports:
      - "127.0.0.1:18008:8008"
    build:
      context: ./student-4
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: http://student-4-database:8009
      LOCATION_URL: http://shared-backend:9100
      ITINERARY_URL: http://student-1-backend:8001
      AI_MODE_URL: "${STUDENT4_BACKEND_AI_MODE_URL:-http://host.docker.internal:8006}"
      AI_MODE_TIMEOUT: "${STUDENT4_BACKEND_AI_MODE_TIMEOUT:-100}"
      AI_ASSISTANT_ENABLED: "${STUDENT4_AI_ASSISTANT_ENABLED:-true}"
      AGENT_TIMEOUT: "${STUDENT4_AGENT_TIMEOUT:-210}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8008"
    depends_on:
      student-4-database:
        condition: service_healthy
      shared-backend:
        condition: service_started
      student-1-backend:
        condition: service_started

  # HTMX frontend. Talks to the Student 4 backend and nothing else.
  student-4-frontend:
    build:
      context: ./student-4
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: "${STUDENT4_FRONTEND_BACKEND_URL:-http://student-4-backend:8008}"
      BACKEND_TIMEOUT: "${STUDENT4_FRONTEND_BACKEND_TIMEOUT:-5}"
      AI_TIMEOUT: "${STUDENT4_FRONTEND_AI_TIMEOUT:-210}"
    ports:
      - "${STUDENT4_FRONTEND_HOST_PORT:-8084}:8084"
    depends_on:
      student-4-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Internal-only database. The backend reaches it at
  # http://student-4-database:8009 on the Compose network.
  student-4-database:
    build:
      context: ./student-4
      dockerfile: database/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/student-4/activities.db
      SEED_DATA: "1"
    expose:
      - "8009"
    volumes:
      - student-4-sqlite:/data/student-4
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/internal/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Student 5: Budget & Expense Management
  # Grouping target for the complete Student 5 slice:
  # `docker compose up --build student-5`.
  student-5:
    image: alpine:3
    command: ["true"]
    depends_on:
      student-5-frontend:
        condition: service_healthy

  student-5-frontend:
    build:
      context: ./student-5
      dockerfile: frontend/Dockerfile
    environment:
      STUDENT5_FRONTEND_BACKEND_BASE_URL: http://student-5-backend:8005
      STUDENT5_FRONTEND_AI_ANALYSIS_TIMEOUT_SECONDS: "230"
      STUDENT5_FRONTEND_RAG_TIMEOUT_SECONDS: "150"
      STUDENT5_FRONTEND_MCP_TIMEOUT_SECONDS: "60"
    ports:
      - "8085:8085"
    depends_on:
      student-5-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  student-5-backend:
    build:
      context: ./student-5
      dockerfile: backend/Dockerfile
    environment:
      STUDENT5_BACKEND_API_PREFIX: /api/v1
      STUDENT5_BACKEND_DB_API_BASE_URL: http://student-5-database:8007
      STUDENT5_BACKEND_TRIPS_API_BASE_URL: http://student-1-backend:8001
      STUDENT5_BACKEND_TRANSPORT_API_BASE_URL: http://student-3-backend:8003
      STUDENT5_BACKEND_ACCOMMODATION_API_BASE_URL: http://student-2-backend:9000
      STUDENT5_BACKEND_ACTIVITY_API_BASE_URL: http://student-4-backend:8008
      STUDENT5_BACKEND_AI_MODE_BASE_URL: http://host.docker.internal:8006
      STUDENT5_BACKEND_AI_MODE_TIMEOUT_SECONDS: "200"
      STUDENT5_BACKEND_RAG_ENABLED: "${STUDENT5_BACKEND_RAG_ENABLED:-true}"
      STUDENT5_BACKEND_RAG_BASE_URL: http://host.docker.internal:8011
      STUDENT5_BACKEND_RAG_TIMEOUT_SECONDS: "130"
      STUDENT5_BACKEND_MCP_ENABLED: "${STUDENT5_BACKEND_MCP_ENABLED:-true}"
      STUDENT5_BACKEND_MCP_BASE_URL: http://host.docker.internal:8012/mcp
      STUDENT5_BACKEND_MCP_TIMEOUT_SECONDS: "40"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8005"
    ports:
      - "127.0.0.1:${STUDENT5_BACKEND_HOST_PORT:-18005}:8005"
    depends_on:
      student-5-database:
        condition: service_healthy
      student-1-backend:
        condition: service_started
      student-3-backend:
        condition: service_started
      student-2-backend:
        condition: service_started
      student-4-backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  student-5-database:
    build:
      context: ./student-5
      dockerfile: database/Dockerfile
    environment:
      STUDENT5_SQLITE_PATH: /data/student-5/tripgenie.db
    expose:
      - "8007"
    volumes:
      - student-5-sqlite:/data/student-5
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  shared-db:
  student-1-db:
  student-2-db:
  student-3-sqlite:
  student-4-sqlite:
  student-5-sqlite:
