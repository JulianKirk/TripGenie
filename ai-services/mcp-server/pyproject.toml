[project]
name = "tripgenie-mcp-server"
version = "0.1.0"
description = "Shared read-only TripGenie MCP tool server"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.6,<1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tripgenie_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]