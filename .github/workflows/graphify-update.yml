name: Graphify Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify-update-main
  cancel-in-progress: false

jobs:
  update-graph:
    name: Update repository knowledge graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned Graphify version
        run: python -m pip install 'graphifyy==0.8.44'

      - name: Update code graph
        env:
          PYTHONHASHSEED: '0'
        run: graphify update .

      - name: Commit portable graph outputs
        shell: bash
        run: |
          graph_files=(
            graphify-out/graph.json
            graphify-out/graph.html
            graphify-out/GRAPH_REPORT.md
          )

          if git diff --quiet -- "${graph_files[@]}"; then
            echo 'Graphify outputs are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${graph_files[@]}"

          if git diff --cached --quiet; then
            echo 'Graphify produced no portable changes.'
            exit 0
          fi

          git commit -m 'chore: update Graphify graph [skip ci]'
          git push origin HEAD:main
