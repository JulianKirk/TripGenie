name: Student 4 CI

on:
  push:
    paths:
      - 'student-4/**'
      - '.github/workflows/student-4-ci.yml'
      - 'docker-compose.yml'
      - 'ruff.toml'
  pull_request:
    paths:
      - 'student-4/**'
      - '.github/workflows/student-4-ci.yml'
      - 'docker-compose.yml'
      - 'ruff.toml'
  workflow_dispatch:

jobs:
  frontend:
    name: Build and Validate Student 4 Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: student-4/pyproject.toml
      - name: Install frontend and development dependencies
        run: python -m pip install -e "./student-4[dev]"
      - name: Validate the installed frontend package
        run: python -c "import student4_frontend_service"
      - name: Compile frontend source and tests
        run: |
          python -m compileall \
            student-4/frontend/student4_frontend_service \
            student-4/tests/frontend
      - name: Lint and check frontend formatting
        run: |
          ruff check student-4/frontend student-4/tests/frontend
          ruff format --check student-4/frontend student-4/tests/frontend
      - name: Type check frontend
        run: |
          mypy --config-file student-4/pyproject.toml \
            student-4/frontend/student4_frontend_service \
            student-4/tests/frontend
      - name: Run frontend tests
        run: pytest student-4/tests/frontend -q
      - name: Build frontend image
        run: |
          docker build \
            -f student-4/frontend/Dockerfile \
            -t student-4-frontend \
            student-4
      - name: Smoke test degraded frontend health
        run: |
          docker run -d --name student-4-frontend -p 18084:8084 \
            -e BACKEND_URL=http://127.0.0.1:65534 \
            -e BACKEND_TIMEOUT=0.25 \
            student-4-frontend
          for _ in $(seq 1 10); do
            response=$(curl --fail --silent --show-error \
              http://127.0.0.1:18084/health || true)
            if echo "$response" | grep -q '"status":"degraded"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs student-4-frontend
          exit 1
      - name: Validate Compose configuration
        run: docker compose config --quiet

  database:
    name: Build and Validate Student 4 Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: student-4/pyproject.toml
      - name: Install database and development dependencies
        run: python -m pip install -e "./student-4[dev]"
      - name: Validate the installed service packages
        run: |
          python -c "import student4_backend_service"
          python -c "import student4_database_service"
          python -c "import student4_frontend_service"
      - name: Lint and check formatting
        run: |
          ruff check student-4
          ruff format --check student-4
      - name: Type check
        run: |
          mypy --config-file student-4/pyproject.toml \
            student-4/backend/student4_backend_service \
            student-4/database/student4_database_service \
            student-4/tests/backend \
            student-4/tests/database \
            student-4/tests/e2e
      - name: Run database tests
        run: pytest student-4/tests -q
      - name: Build backend image
        run: |
          docker build \
            -f student-4/backend/Dockerfile \
            -t student-4-backend \
            student-4
      - name: Build database image
        run: |
          docker build \
            -f student-4/database/Dockerfile \
            -t student-4-database \
            student-4
      - name: Smoke test the database image
        run: |
          docker run -d --name student-4-database -p 8009:8009 student-4-database
          for _ in $(seq 1 10); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8009/internal/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs student-4-database
          exit 1
      - name: Smoke test the backend image
        run: |
          docker run -d --name student-4-backend -p 8008:8008 student-4-backend
          for _ in $(seq 1 10); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8008/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs student-4-backend
          exit 1
      - name: Validate Compose configuration
        run: docker compose config --quiet

  compose:
    name: Validate Student 4 Compose Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the shared Compose configuration
        run: docker compose config --quiet
      # AI, itinerary, and shared-location calls are advisory for this smoke
      # test. The database is the backend's readiness dependency, so the owned
      # three-service slice can be verified without starting the whole stack.
      - name: Bring the Student 4 slice up and wait for readiness
        run: |
          docker compose up -d --build --wait --no-deps \
            student-4-database student-4-backend student-4-frontend
      - name: Check the frontend on its assignment port
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8084/ready
          curl --fail --silent --show-error http://127.0.0.1:8084/ > /dev/null
      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose logs --no-color \
            student-4-database student-4-backend student-4-frontend
      - name: Tear down
        if: always()
        run: docker compose down -v
