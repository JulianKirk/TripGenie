name: Student 5 CI

on:
  push:
    paths:
      - 'student-5/**'
      - '.github/workflows/student-5-ci.yml'
      - 'docker-compose.yml'
      - 'ruff.toml'
  pull_request:
    paths:
      - 'student-5/**'
      - '.github/workflows/student-5-ci.yml'
      - 'docker-compose.yml'
      - 'ruff.toml'
  workflow_dispatch:

jobs:
  validate:
    name: Build and Validate Student 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: student-5/pyproject.toml
      - name: Install Student 5 dependencies
        working-directory: student-5
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate installed packages
        working-directory: student-5
        run: python -c "import student5_backend_service, student5_database_service, student5_frontend_service"
      - name: Run syntax checks
        working-directory: student-5
        run: python -m compileall backend database frontend tests
      - name: Run Ruff checks
        working-directory: student-5
        run: python -m ruff check backend database frontend tests
      - name: Run tests
        working-directory: student-5
        run: python -m pytest
      - name: Build Student 5 images
        run: |
          docker build -f student-5/database/Dockerfile -t student-5-database student-5
          docker build -f student-5/backend/Dockerfile -t student-5-backend student-5
          docker build -f student-5/frontend/Dockerfile -t student-5-frontend student-5
      - name: Validate the shared Compose configuration
        run: docker compose config --quiet
      - name: Smoke test the Student 5 slice
        run: docker compose up -d --build --wait --no-deps student-5-database student-5-backend student-5-frontend
      - name: Check the Student 5 frontend
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8085/ready
          curl --fail --silent --show-error http://127.0.0.1:8085/ > /dev/null
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color student-5-database student-5-backend student-5-frontend
      - name: Tear down
        if: always()
        run: docker compose down -v
