name: Shared User CI

on:
  push:
    paths:
      - 'shared/user/**'
      - 'ruff.toml'
      - 'docker-compose.yml'
      - '.github/workflows/shared-user-ci.yml'
  pull_request:
    paths:
      - 'shared/user/**'
      - 'ruff.toml'
      - 'docker-compose.yml'
      - '.github/workflows/shared-user-ci.yml'
  workflow_dispatch:

jobs:
  services:
    name: Build and Validate Shared User Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: shared/user/pyproject.toml
      - name: Install dependencies
        run: pip install -e "./shared/user[dev]"
      - name: Lint
        run: |
          ruff check shared/user
          ruff format --check shared/user
      - name: Run tests
        run: pytest shared/user/tests -q
      - name: Build database service image
        run: docker build -f shared/user/database/Dockerfile -t shared-user-database shared/user
      - name: Health check database service
        run: |
          docker run -d --name shared-user-database -p 9101:9101 shared-user-database
          for _ in $(seq 1 8); do
            if curl -fsS http://localhost:9101/health; then
              echo "database service healthy"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy after 8 attempts"
          docker logs shared-user-database
          exit 1
      - name: Build backend service image
        run: docker build -f shared/user/backend/Dockerfile -t shared-user-backend shared/user
      - name: Health check backend service
        # No database container on this network, so /health answers "degraded"
        # with a 200 -- that is the documented behaviour and what is under test
        # here: the service itself starts and serves.
        run: |
          docker run -d --name shared-user-backend -p 9100:9100 shared-user-backend
          for _ in $(seq 1 8); do
            if curl -fsS http://localhost:9100/health; then
              echo "backend service healthy"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy after 8 attempts"
          docker logs shared-user-backend
          exit 1
      - name: Build frontend service image
        run: docker build -f shared/user/frontend/Dockerfile -t shared-user-frontend shared/user
      - name: Health check frontend service
        # Same as the backend above: no backend container on this network, so
        # /health answers "degraded" with a 200. What is under test is that the
        # service starts and serves.
        run: |
          docker run -d --name shared-user-frontend -p 9103:9103 shared-user-frontend
          for _ in $(seq 1 8); do
            if curl -fsS http://localhost:9103/health; then
              echo "frontend service healthy"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy after 8 attempts"
          docker logs shared-user-frontend
          exit 1
