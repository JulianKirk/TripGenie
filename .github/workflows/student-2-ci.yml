name: Student 2 CI

on:
  push:
    paths:
      - 'student-2/**'
      - 'shared/**'
      - 'ruff.toml'
      - '.github/workflows/student-2-ci.yml'
  pull_request:
    paths:
      - 'student-2/**'
      - 'shared/**'
      - 'ruff.toml'
      - '.github/workflows/student-2-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Build and Validate Student 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: student-2/pyproject.toml
      - name: Install dependencies
        run: pip install -e "./student-2[dev]"
      - name: Lint
        run: |
          ruff check shared student-2
          ruff format --check shared student-2
      - name: Run tests
        run: pytest student-2/tests -q
