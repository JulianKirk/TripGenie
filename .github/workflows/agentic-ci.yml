name: Agentic Loop

# PLAN -> ACT -> OBSERVE -> AGENTS -> HUMAN -> ADAPT against every service's
# public backend.
#
# This is a post step: each job waits for that service's own build-and-validate
# workflow to finish on the same commit, and stops if it failed. The waiting is
# done here rather than with a `workflow_run` trigger because workflow_run only
# fires from the default branch's copy of a workflow file -- it does nothing on
# a feature branch, which is where this needs to work.
on:
  push:
    paths:
      - 'shared/**'
      - 'student-*/**'
      - 'ai-services/agentic-loop/**'
      - 'docker-compose.yml'
      - '.github/workflows/agentic-ci.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'student-*/**'
      - 'ai-services/agentic-loop/**'
      - 'docker-compose.yml'
      - '.github/workflows/agentic-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Loop unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/agentic-loop/requirements.txt
      - run: pip install -r ai-services/agentic-loop/requirements.txt pytest
      - working-directory: ai-services/agentic-loop
        run: pytest -q

  # The gate, for every service at once. Each service's own build-and-validate
  # workflow decides whether its loop runs, and this job reports the verdict.
  plan:
    name: Pick services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      empty: ${{ steps.pick.outputs.empty }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          services=ai-services/agentic-loop/services.json
          chosen=""
          {
            echo "## Agentic loop"
            echo ""
            echo "| Service | Build and validate | Loop |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for svc in $(jq -r '.[].service' "$services"); do
            ci=$(jq -r --arg s "$svc" '.[] | select(.service == $s) | .ci' "$services")
            if [ "$DISPATCH" = "true" ]; then
              chosen="$chosen $svc"
              echo "| $svc | not checked (manual run) | runs |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            verdict=unchanged
            for attempt in $(seq 1 120); do
              # gh prints API errors on stdout and exits non-zero, so gate on
              # the exit code -- an error body is not a workflow status.
              if raw=$(gh api "repos/$REPO/actions/workflows/$ci/runs?head_sha=$SHA&per_page=1" \
                --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion)"' 2>&1); then
                case "$raw" in
                  "completed success"|"completed skipped") verdict=passed; break ;;
                  completed*) verdict="failed ($raw)"; break ;;
                  "")
                    # Two minutes to appear. If it never does, its path filters
                    # skipped this commit, so the service did not change.
                    [ "$attempt" -ge 8 ] && break ;;
                  *) echo "$ci is $raw; waiting" ;;
                esac
              else
                echo "could not read $ci: $raw"
                # Do not let a broken gate silently stop the validation.
                [ "$attempt" -ge 8 ] && { verdict=unreadable; break; }
              fi
              sleep 15
            done
            case "$verdict" in
              passed)     chosen="$chosen $svc"; row="passed | runs" ;;
              unreadable) chosen="$chosen $svc"; row="could not read | runs ungated" ;;
              unchanged)  row="did not run | skipped, service unchanged" ;;
              *)          row="$verdict | skipped, build and validate failed" ;;
            esac
            echo "| $svc | $row |" >> "$GITHUB_STEP_SUMMARY"
          done

          selected=$(jq -c --arg picked "$chosen" \
            '($picked | split(" ") | map(select(length > 0))) as $p
             | [.[] | select(.service as $s | $p | index($s))]' "$services")
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"
          if [ "$selected" = "[]" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "**No services were changed - agentic loop skipped for all services.**"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

  loop:
    name: ${{ matrix.service }}
    needs: [test, plan]
    if: needs.plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Enough to comment on a pull request from a branch in this repo. A pull
      # request from a fork gets a read-only token and no comment -- the report
      # is still on the job summary.
      pull-requests: write
    strategy:
      # One service's failure should not hide the others' on a manual run.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SERVICE_URL: http://127.0.0.1:${{ matrix.port }}
      CHECKS_FILE: checks/${{ matrix.service }}.json
      # Optional. Without it the two agent sections print "unavailable" and the
      # deterministic checks still gate the build.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/agentic-loop/requirements.txt
      - name: Install dependencies
        run: pip install -r ai-services/agentic-loop/requirements.txt pytest
      - name: Start the service
        # Compose pulls in whatever the service depends on -- its database, and
        # for student 2 the two backends it calls. The overlay publishes student
        # 3's backend, which is internal-only in the main file.
        run: |
          docker compose \
            -f docker-compose.yml \
            -f ai-services/agentic-loop/docker-compose.agentic.yml \
            up -d --build ${{ matrix.compose }}
      - name: Wait for the service to answer
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "$SERVICE_URL${{ matrix.health }}" | grep -q '${{ matrix.ready }}'; then
              exit 0
            fi
            sleep 3
          done
          echo "${{ matrix.service }} did not become ready after 20 attempts"
          docker compose logs --tail 50
          exit 1
      - name: Run the agentic loop
        working-directory: ai-services/agentic-loop
        run: python agentic_loop.py --ci
      # The loop already wrote its report to the step summary, and that is a
      # real file on the runner -- reuse it verbatim as the comment body rather
      # than rendering the same markdown twice.
      - name: Comment the report on the pull request
        # always(), because a failing loop is the run worth commenting on.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MARKER: '<!-- agentic-loop: ${{ matrix.service }} -->'
        run: |
          if [ ! -s "$GITHUB_STEP_SUMMARY" ]; then
            echo "no report to post -- the loop did not get far enough"
            exit 0
          fi
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "commit $SHA is not on an open pull request; nothing to comment on"
            exit 0
          fi
          body=$(printf '%s\n\n%s' "$MARKER" "$(cat "$GITHUB_STEP_SUMMARY")")
          # One comment per service, edited in place, so a busy pull request
          # does not collect a new wall of tables on every push.
          existing=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body"
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body"
          fi

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 100
