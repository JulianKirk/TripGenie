name: Agentic Loop

# PLAN -> ACT -> OBSERVE -> AGENTS -> HUMAN -> ADAPT against every service's
# public backend.
#
# This is a post step: each job waits for that service's own build-and-validate
# workflow to finish on the same commit, and stops if it failed. The waiting is
# done here rather than with a `workflow_run` trigger because workflow_run only
# fires from the default branch's copy of a workflow file -- it does nothing on
# a feature branch, which is where this needs to work.
on:
  push:
    paths:
      - 'shared/**'
      - 'student-*/**'
      - 'ai-services/agentic-loop/**'
      - 'docker-compose.yml'
      - '.github/workflows/agentic-ci.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'student-*/**'
      - 'ai-services/agentic-loop/**'
      - 'docker-compose.yml'
      - '.github/workflows/agentic-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Loop unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/agentic-loop/requirements.txt
      - run: pip install -r ai-services/agentic-loop/requirements.txt pytest
      - working-directory: ai-services/agentic-loop
        run: pytest -q

  # The matrix comes from services.json so there is one place to add a service.
  plan:
    name: Pick services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          selected=$(jq -c . ai-services/agentic-loop/services.json)
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"

  loop:
    name: ${{ matrix.service }}
    needs: [test, plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Listing another workflow's runs is an Actions API read. Declaring any
      # permissions block zeroes the rest, so this has to be spelled out.
      actions: read
      # Enough to comment on a pull request from a branch in this repo. A pull
      # request from a fork gets a read-only token and no comment -- the report
      # is still on the job summary.
      pull-requests: write
    strategy:
      # One service's failure should not hide the others' on a manual run.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SERVICE_URL: http://127.0.0.1:${{ matrix.port }}
      CHECKS_FILE: checks/${{ matrix.service }}.json
      # Optional. Without it the two agent sections print "unavailable" and the
      # deterministic checks still gate the build.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      # The post step gate. Poll this service's own CI for the same commit:
      # proceed on success, stop on failure, and proceed anyway if that workflow
      # never starts -- its path filters mean an unrelated change does not run
      # it, and there is then nothing to wait for.
      - name: Wait for ${{ matrix.ci }}
        id: gate
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI: ${{ matrix.ci }}
        run: |
          for attempt in $(seq 1 120); do
            # gh prints the API error body on stdout and exits non-zero, so the
            # status has to gate on the exit code -- otherwise a 403 body looks
            # like a workflow status and the poll spins until it times out.
            if raw=$(gh api "repos/$REPO/actions/workflows/$CI/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion)"' 2>&1); then
              case "$raw" in
                "completed success"|"completed skipped")
                  echo "$CI passed for $SHA"; exit 0 ;;
                completed*)
                  echo "$CI did not pass for $SHA ($raw) -- skipping the loop"; exit 1 ;;
                "")
                  # Give it two minutes to appear before deciding it never will.
                  # Its path filters skipped this commit, which means this
                  # service did not change -- there is nothing here to validate.
                  if [ "$attempt" -ge 8 ]; then
                    echo "$CI did not run for $SHA; ${{ matrix.service }} is unchanged, skipping"
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi ;;
                *)
                  echo "$CI is $raw; waiting" ;;
              esac
            else
              echo "could not read $CI status: $raw"
              if [ "$attempt" -ge 8 ]; then
                echo "giving up on the gate after 2 minutes; running the loop ungated"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "$CI did not finish within 30 minutes"
          exit 1

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-services/agentic-loop/requirements.txt
      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r ai-services/agentic-loop/requirements.txt pytest
      - name: Start the service
        if: steps.gate.outputs.skip != 'true'
        # Compose pulls in whatever the service depends on -- its database, and
        # for student 2 the two backends it calls. The overlay publishes student
        # 3's backend, which is internal-only in the main file.
        run: |
          docker compose \
            -f docker-compose.yml \
            -f ai-services/agentic-loop/docker-compose.agentic.yml \
            up -d --build ${{ matrix.compose }}
      - name: Wait for the service to answer
        if: steps.gate.outputs.skip != 'true'
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "$SERVICE_URL${{ matrix.health }}" | grep -q '${{ matrix.ready }}'; then
              exit 0
            fi
            sleep 3
          done
          echo "${{ matrix.service }} did not become ready after 20 attempts"
          docker compose logs --tail 50
          exit 1
      - name: Run the agentic loop
        if: steps.gate.outputs.skip != 'true'
        working-directory: ai-services/agentic-loop
        run: python agentic_loop.py --ci
      # The loop already wrote its report to the step summary, and that is a
      # real file on the runner -- reuse it verbatim as the comment body rather
      # than rendering the same markdown twice.
      - name: Comment the report on the pull request
        # always(), because a failing loop is the run worth commenting on --
        # but not when the service was skipped and there is no report.
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MARKER: '<!-- agentic-loop: ${{ matrix.service }} -->'
        run: |
          if [ ! -s "$GITHUB_STEP_SUMMARY" ]; then
            echo "no report to post -- the loop did not get far enough"
            exit 0
          fi
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "commit $SHA is not on an open pull request; nothing to comment on"
            exit 0
          fi
          body=$(printf '%s\n\n%s' "$MARKER" "$(cat "$GITHUB_STEP_SUMMARY")")
          # One comment per service, edited in place, so a busy pull request
          # does not collect a new wall of tables on every push.
          existing=$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body"
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body"
          fi

      - name: Service logs
        if: failure() && steps.gate.outputs.skip != 'true'
        run: docker compose logs --tail 100
