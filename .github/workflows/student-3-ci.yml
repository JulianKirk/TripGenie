name: Student 3 CI

on:
  push:
    paths:
      - 'student-3/**'
      - '.github/workflows/student-3-ci.yml'
      - 'shared/configuration/**'
      - 'shared/frontend/index.html'
      - 'docker-compose.yml'
      - 'scripts/ci/wait_for_http.py'
  pull_request:
    paths:
      - 'student-3/**'
      - '.github/workflows/student-3-ci.yml'
      - 'shared/configuration/**'
      - 'shared/frontend/index.html'
      - 'docker-compose.yml'
      - 'scripts/ci/wait_for_http.py'
  workflow_dispatch:

jobs:
  database:
    name: Build and Validate Student 3 Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Student 3 database dependencies
        working-directory: student-3
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Validate installed Student 3 packages
        working-directory: student-3
        run: python -c "import student3_backend_service, student3_database_service"
      - name: Run Student 3 database syntax checks
        working-directory: student-3
        run: python -m compileall database/student3_database_service tests/database
      - name: Run Student 3 database Ruff checks
        working-directory: student-3
        run: python -m ruff check database/student3_database_service tests/database
      - name: Run Student 3 database pytest suite
        working-directory: student-3
        run: python -m pytest tests/database
      - name: Build Student 3 database image
        run: docker build -f student-3/database/Dockerfile student-3

  backend:
    name: Build and Validate Student 3 Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Student 3 backend dependencies
        working-directory: student-3
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Validate installed Student 3 packages
        working-directory: student-3
        run: python -c "import student3_backend_service, student3_database_service"
      - name: Run Student 3 backend syntax checks
        working-directory: student-3
        run: python -m compileall backend/student3_backend_service tests/backend
      - name: Run Student 3 backend Ruff checks
        working-directory: student-3
        run: python -m ruff check backend/student3_backend_service tests/backend
      - name: Run Student 3 backend pytest suite
        working-directory: student-3
        run: python -m pytest tests/backend
      - name: Build Student 3 backend image
        run: docker build -f student-3/backend/Dockerfile student-3

  frontend:
    name: Build and Validate Student 3 Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Student 3 frontend dependencies
        working-directory: student-3
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Validate installed Student 3 packages
        working-directory: student-3
        run: python -c "import student3_frontend_service, student3_backend_service, student3_database_service"
      - name: Run Student 3 frontend syntax checks
        working-directory: student-3
        run: python -m compileall frontend/student3_frontend_service tests/frontend
      - name: Run Student 3 frontend Ruff checks
        working-directory: student-3
        run: python -m ruff check frontend/student3_frontend_service tests/frontend
      - name: Run Student 3 frontend pytest suite
        working-directory: student-3
        run: python -m pytest tests/frontend
      - name: Build Student 3 frontend image
        run: docker build -f student-3/frontend/Dockerfile student-3

  compose:
    name: Validate Student 3 Compose Integration
    runs-on: ubuntu-latest
    # The MCP integration stays in the image and the Compose wiring, but no
    # host-run MCP server exists on a runner, so CI switches it off and then
    # proves the switch took effect. Shell environment overrides the
    # Compose default of true.
    env:
      STUDENT3_BACKEND_MCP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Validate the shared Compose configuration
        run: docker compose config --quiet
      # Targets the frontend rather than the `student-3` grouping service:
      # that group is a container that exits immediately, and --wait treats an
      # exited container as a failure.
      #
      # --no-deps with all three named explicitly, because the backend now
      # declares AI-Mode as a dependency and following it would pull the
      # multi-gigabyte Ollama image for a slice that does not need it. AI
      # suggestions are advisory: the rest of the feature is expected to work
      # with AI-Mode absent, so a run without it is the more useful check.
      - name: Bring the Student 3 slice up and wait for health
        run: |
          docker compose up -d --build --no-deps \
            student-3-database student-3-backend student-3-frontend
      - name: Check the frontend answers on its published port
        run: |
          port=$(docker compose port student-3-frontend 8093 | cut -d: -f2)
          python scripts/ci/wait_for_http.py \
            --label "student 3 compose frontend" \
            --contains '"status":"ok"' \
            "http://127.0.0.1:${port}/ready"
          curl --fail --silent --show-error "http://127.0.0.1:${port}/" > /dev/null
          echo "Student 3 frontend answered on published port ${port}."
      - name: Check the shared home page links that same port
        run: |
          port=$(docker compose port student-3-frontend 8093 | cut -d: -f2)
          linked=$(grep -oE 'localhost:[0-9]+"[^>]*>[[:space:]]*Student 3'             shared/frontend/index.html | grep -oE '[0-9]+' | head -1)
          if [ "$port" != "$linked" ]; then
            echo "::error::Compose publishes ${port} but the shared home page links ${linked}."
            exit 1
          fi
          echo "Home page link and published port agree on ${port}."
      - name: Verify MCP is disabled
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18003/health             | python -c "import json, sys; i = json.load(sys.stdin)['data']['integrations']; print('backend integrations:', i); assert i == {'mcp': 'disabled'}"
          curl --silent --show-error -X POST -H 'Content-Type: application/json'             -d '{"destination": "Melbourne"}'             http://127.0.0.1:18003/api/transport-options/mcp/search             | python -c "import json, sys; e = json.load(sys.stdin)['error']; print('backend MCP route:', e['code']); assert e['code'] == 'MCP_DISABLED'"
          port=$(docker compose port student-3-frontend 8093 | cut -d: -f2)
          curl --fail --silent --show-error -X POST             --data-urlencode 'destination=Melbourne'             "http://127.0.0.1:${port}/tools/search" | grep -q 'disabled in this environment'
          echo 'Frontend MCP tools page shows the disabled state.'
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
