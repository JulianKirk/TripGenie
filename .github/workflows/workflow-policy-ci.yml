name: Workflow Policy CI

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/workflows/workflow-policy-ci.yml'
      - '.github/tests/test_workflow_self_triggers.py'
      - '.pre-commit-config.yaml'
      - 'scripts/security/**'
      - 'scripts/ci/**'
      - 'scripts/deploy/**'
      - 'infra/**'
      - 'tests/ci/**'
      - 'ruff.toml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/workflows/workflow-policy-ci.yml'
      - '.github/tests/test_workflow_self_triggers.py'
      - '.pre-commit-config.yaml'
      - 'scripts/security/**'
      - 'scripts/ci/**'
      - 'scripts/deploy/**'
      - 'infra/**'
      - 'tests/ci/**'
      - 'ruff.toml'
  workflow_dispatch:

jobs:
  self-trigger-policy:
    name: Validate workflow self-triggers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install 'pytest>=9.0.3,<10' pyyaml -r scripts/security/requirements.txt
      - name: Check workflow trigger policy and local gate regression tests
        run: pytest -q .github/tests/test_workflow_self_triggers.py tests/ci
      - name: Compile the Azure Bicep template
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null
