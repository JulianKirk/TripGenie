name: Student 1 CI

on:
  push:
    paths:
      - 'student-1/**'
      - 'ai-services/ai-mode/**'
      - 'ai-services/rag-server/**'
      - 'docs/architecture/student-1-*.md'
      - 'docs/reports/release-0/student-1-release-0-plan.md'
      - 'shared/configuration/**'
      - '.github/workflows/student-1-ci.yml'
      - '.github/workflows/ai-mode-ci.yml'
      - 'docker-compose.yml'
      - 'ruff.toml'
      - 'scripts/ci/wait_for_http.py'
  pull_request:
    paths:
      - 'student-1/**'
      - 'ai-services/ai-mode/**'
      - 'ai-services/rag-server/**'
      - 'docs/architecture/student-1-*.md'
      - 'docs/reports/release-0/student-1-release-0-plan.md'
      - 'shared/configuration/**'
      - '.github/workflows/student-1-ci.yml'
      - '.github/workflows/ai-mode-ci.yml'
      - 'docker-compose.yml'
      - 'ruff.toml'
      - 'scripts/ci/wait_for_http.py'
  workflow_dispatch:

# Release 1 keeps the RAG and MCP integrations in the code but CI never reaches
# a host service: both are switched off here and the compose job proves it.
# AI-Mode has no switch; its compose URL points at the host and nothing in CI
# calls it.
env:
  STUDENT1_BACKEND_RAG_ENABLED: "false"
  STUDENT1_BACKEND_MCP_ENABLED: "false"

jobs:
  database:
    name: Build and Validate Student 1 Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Student 1 database dependencies
        working-directory: student-1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Validate installed Student 1 packages
        working-directory: student-1
        run: python -c "import backend_service, database_service"
      - name: Run Student 1 database syntax checks
        working-directory: student-1
        run: python -m compileall database/database_service tests/database
      - name: Run Student 1 database Ruff checks
        working-directory: student-1
        run: python -m ruff check database/database_service tests/database
      - name: Run Student 1 database pytest suite
        working-directory: student-1
        run: python -m pytest tests/database
      - name: Build Student 1 database image
        run: docker build -f student-1/database/Dockerfile student-1

  backend:
    name: Build and Validate Student 1 Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Student 1 backend dependencies
        working-directory: student-1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../ai-services/ai-mode
          python -m pip install -e .[dev]
      - name: Validate installed Student 1 packages
        working-directory: student-1
        run: python -c "import backend_service, database_service"
      - name: Run Student 1 backend syntax checks
        working-directory: student-1
        run: python -m compileall backend/backend_service tests/backend
      - name: Run Student 1 backend Ruff checks
        working-directory: student-1
        run: python -m ruff check backend/backend_service tests/backend
      - name: Run Student 1 backend pytest suite
        working-directory: student-1
        run: python -m pytest tests/backend
      - name: Build Student 1 backend image
        run: docker build -f student-1/backend/Dockerfile student-1

  frontend:
    name: Build and Validate Student 1 Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Student 1 frontend dependencies
        working-directory: student-1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Validate installed Student 1 frontend package
        working-directory: student-1
        run: python -c "import frontend_service"
      - name: Run Student 1 frontend syntax checks
        working-directory: student-1
        run: python -m compileall frontend/frontend_service tests/frontend
      - name: Run Student 1 frontend Ruff checks
        working-directory: student-1
        run: python -m ruff check frontend/frontend_service tests/frontend
      - name: Run Student 1 frontend pytest suite
        working-directory: student-1
        run: python -m pytest tests/frontend
      - name: Build Student 1 frontend image
        run: docker build -f student-1/frontend/Dockerfile student-1

  rag-server:
    name: Validate Shared RAG Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install RAG server dependencies
        working-directory: ai-services/rag-server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run RAG server syntax checks
        working-directory: ai-services/rag-server
        run: python -m compileall rag_service tests
      - name: Run RAG server Ruff checks
        working-directory: ai-services/rag-server
        run: python -m ruff check rag_service tests
      # Fake embeddings and generation: no Ollama, no model download.
      - name: Run RAG server pytest suite
        working-directory: ai-services/rag-server
        run: python -m pytest

  compose:
    name: Validate Student 1 Compose Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the shared Compose configuration
        run: docker compose config --quiet
      - name: Reject host-only AI services in Compose
        run: |
          if docker compose config --services | grep -E 'ai-mode|mcp|rag|ollama|agentic'; then
            echo "::error::AI-Mode, MCP, RAG, Ollama and the agentic loop must stay host services, not Compose services."
            exit 1
          fi
          echo 'No host-only AI service is defined in Compose.'
      - name: Start the Student 1 slice
        run: |
          docker compose up -d --build --no-deps \
            student-1-database student-1-backend student-1-frontend
      - name: Apply the shared readiness baseline
        run: |
          python scripts/ci/wait_for_http.py \
            --label "student 1 compose frontend" \
            --contains '"status":"ok"' \
            http://127.0.0.1:8081/ready
      - name: Verify MCP and RAG are disabled
        run: |
          docker compose exec -T student-1-backend env \
            | grep -E '^STUDENT1_BACKEND_(RAG|MCP)_ENABLED='
          trip=http://127.0.0.1:18001/api/trips/trip_2026_melbourne_food_trail
          check() {
            status=$(curl --silent --show-error -o body.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' -d "$2" "$trip/$1")
            code=$(python -c "import json; print(json.load(open('body.json'))['error']['code'])" 2>/dev/null || true)
            echo "backend $1: HTTP $status $code"
            if [ "$status" != 503 ] || [ "$code" != "$3" ]; then
              echo "::error::$1 should answer 503 $3 while disabled."
              exit 1
            fi
          }
          check rag-query '{"question":"x"}' RAG_DISABLED
          check mcp-options '{}' MCP_DISABLED
      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose logs --no-color \
            student-1-database student-1-backend student-1-frontend
      - name: Tear down
        if: always()
        run: docker compose down -v
