name: Student 1 CI

on:
  push:
    paths:
      - 'student-1/**'
      - '.github/workflows/student-1-ci.yml'
  pull_request:
    paths:
      - 'student-1/**'
      - '.github/workflows/student-1-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Build and Validate Student 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Student 1 dependencies
        working-directory: student-1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run syntax checks
        working-directory: student-1
        run: python -m compileall database/database_service tests/database
      - name: Run Ruff
        working-directory: student-1
        run: python -m ruff check database/database_service tests/database
      - name: Run Student 1 database tests
        working-directory: student-1
        run: python -m pytest tests/database
      - name: Build Student 1 database image
        run: docker build -f student-1/database/Dockerfile student-1
