[project]
name = "tripgenie-student4-frontend"
version = "0.1.0"
description = "Student 4 activities and attractions HTMX frontend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["student4_frontend_service*"]

[tool.setuptools.package-data]
student4_frontend_service = [
    "templates/*.html",
    "templates/macros/*.html",
    "templates/partials/*.html",
    "static/css/*.css",
    "static/js/*.js",
]
