<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title|default("Activities & Attractions") }} · TripGenie Student 4</title>
  <link rel="stylesheet" href="http://localhost:8080/theme.css">
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/styles.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="{{ request.url_for('static', path='js/app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <p class="eyebrow">TripGenie Student 4</p>
      <h1><a href="/">Activities &amp; Attractions</a></h1>
      <p>Explore experiences and attractions from one catalogue. TripGenie does not make bookings or take payments.</p>
      <nav class="site-nav" aria-label="Student 4"><a href="/">Browse activities</a></nav>
      <a class="site-header__home" href="http://localhost:8080">Home</a>
    </div>
  </header>
  <div id="global-loading" class="loading htmx-indicator" role="status" aria-live="polite">Updating activities…</div>
  {% block body %}{% endblock %}
</body>
</html>
