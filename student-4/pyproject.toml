[project]
name = "tripgenie-student4-services"
version = "0.1.0"
description = "Student 4 activities and attractions services for TripGenie."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["database"]
include = ["student4_database_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    'ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\.:UserWarning',
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning',
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["database/student4_database_service", "tests/database"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.database.*"
disallow_untyped_defs = true
