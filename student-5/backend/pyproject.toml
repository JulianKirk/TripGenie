[project]
name = "tripgenie-student5-backend"
version = "0.1.0"
description = "Student 5 budget and expense public API for TripGenie."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["student5_backend_service*"]

[tool.setuptools.package-data]
student5_backend_service = ["prompts/*.md"]