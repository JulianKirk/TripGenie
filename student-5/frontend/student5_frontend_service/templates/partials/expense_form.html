<div class="panel">
  <p class="eyebrow">Trip {{ form.get('trip_id', '') }}</p><h2>{{ heading }}</h2>
  {% if form_error %}<div class="banner banner--error" role="alert">{{ form_error }}</div>{% endif %}
  <form method="post" action="{{ action }}">
    <input type="hidden" name="trip_id" value="{{ form.get('trip_id', '') }}">
    <div class="form-grid">
      <label class="field"><span>Category</span><select name="category" required>{% for category in categories %}<option value="{{ category }}" {% if form.get('category') == category %}selected{% endif %}>{{ category | title }}</option>{% endfor %}</select>{% for issue in errors.get('category', []) %}<span class="field-error">{{ issue }}</span>{% endfor %}</label>
      <label class="field"><span>Description</span><input name="description" value="{{ form.get('description', '') }}" required maxlength="255">{% for issue in errors.get('description', []) %}<span class="field-error">{{ issue }}</span>{% endfor %}</label>
      <label class="field"><span>Amount</span><input name="amount" type="number" min="0.01" step="0.01" value="{{ form.get('amount', '') }}" required>{% for issue in errors.get('amount', []) %}<span class="field-error">{{ issue }}</span>{% endfor %}</label>
      <label class="field"><span>Currency</span><input name="currency" value="{{ form.get('currency', '') }}" pattern="[A-Z]{3}" maxlength="3" required>{% for issue in errors.get('currency', []) %}<span class="field-error">{{ issue }}</span>{% endfor %}</label>
      <label class="field"><span>Date</span><input name="date" type="date" value="{{ form.get('date', '') }}" required>{% for issue in errors.get('date', []) %}<span class="field-error">{{ issue }}</span>{% endfor %}</label>
      <label class="field"><span>Payment method <small>optional</small></span><input name="payment_method" value="{{ form.get('payment_method') or '' }}" maxlength="255"></label>
      <label class="field field--wide"><span>Notes <small>optional</small></span><textarea name="notes" rows="4" maxlength="2000">{{ form.get('notes') or '' }}</textarea></label>
    </div>
    <div class="actions"><button class="button button--primary" type="submit">Save expense</button><a class="button" href="/budgets/{{ budget.budget_id }}">Cancel</a></div>
  </form>
</div>
